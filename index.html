```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defence Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Defence Calculator</h1>
        <p class="description">Calculate effective HP using HP, flat DF, DF%, and incoming damage.</p>

        <section class="calculator">
            <label for="hp">HP</label>
            <input id="hp" type="number" step="any" value="1000">

            <label for="df">DF</label>
            <input id="df" type="number" step="any" value="0">

            <label for="dfPercent">DF%</label>
            <input id="dfPercent" type="number" step="any" value="0">

            <label for="damage">Incoming Damage</label>
            <input id="damage" type="number" step="any" value="100">

            <button id="calculate">Calculate</button>
        </section>

        <section class="results">
            <div>
                <span>Final Damage</span>
                <strong id="finalDamage">0</strong>
            </div>

            <div>
                <span>Damage Multiplier</span>
                <strong id="damageMultiplier">0x</strong>
            </div>

            <div>
                <span>Hits to Kill</span>
                <strong id="hitsToKill">0</strong>
            </div>

            <div>
                <span>Effective HP</span>
                <strong id="effectiveHp">0</strong>
            </div>
        </section>

        <section class="formula">
            <h2>Formula</h2>
            <p>Final Damage = (Raw Damage - DF) × (1 - DF% / 100)</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
```
