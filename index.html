<!DOCTYPE html>
<html>
<head>
    <title>DF Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>DF Calculator</h1>

    <div class="inputs">
        <label>HP</label>
        <input id="hp" type="number" value="1000">

        <label>DF</label>
        <input id="df" type="number" value="0">

        <label>DF%</label>
        <input id="dfpercent" type="number" value="0">

        <label>Incoming Damage</label>
        <input id="damage" type="number" value="100">
    </div>

    <div class="results">
        <p>Damage Taken: <span id="finaldamage">0</span></p>
        <p>Damage Multiplier: <span id="multiplier">1x</span></p>
        <p>Hits To Kill: <span id="hits">0</span></p>
        <p>Effective HP: <span id="ehp">0</span></p>
    </div>

    <p class="formula">
        Damage = (Incoming Damage - DF) × (1 - DF% / 100)
    </p>

    <script src="script.js"></script>
</body>
</html>
